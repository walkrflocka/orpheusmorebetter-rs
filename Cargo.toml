[package]
name = "orpheusmorebetter-rs"
version = "0.2.0-alpha"
edition = "2024"
description = "An auto-transcoding tool for Orpheus.network"

[dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros", "time", "process", "fs", "io-util"] }
anyhow = "1.0.102"
thiserror = "2"
chrono = "0.4.43"
clap = { version = "4.5.59", features = ["derive"] }
reqwest = { version = "0.12", features = [
    "json",
    "cookies",
    "multipart",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-ini = "0.21"
id3 = "1"
regex = "1"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
