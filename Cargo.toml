[package]
name = "orpheusmorebetter-rs"
version = "0.2.0-alpha"
edition = "2024"
description = "An auto-transcoding tool for Orpheus.network"

[dependencies]
tokio = { version = "1.49.0", features = ["rt", "macros"] }
config = "0.15.19"
anyhow = "1.0.102"
chrono = "0.4.43"
# clap = { version = "4.5.59", features = ["derive"] }
futures = "0.3.32"
http = "1.4.0"
reqwest = { version = "0.13.2", features = [
    "json",
    "cookies",
    "query",
    "form",
] }
reqwest-middleware = "0.5.1"
serde = { version = "1.0.228", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
